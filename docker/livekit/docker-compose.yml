services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no

  minio:
    image: minio/minio:latest
    network_mode: host
    # API on all interfaces so LAN phones can fetch presigned WAVs. Console stays loopback.
    command: server /data --address 0.0.0.0:9000 --console-address 127.0.0.1:9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-minio12345}
    volumes:
      - minio-data:/data

  livekit:
    image: livekit/livekit-server:latest
    # Host network so ICE UDP/TCP bind on the PC NIC instead of Docker NAT.
    # Required on Linux for phone media; port mappings are ignored in this mode.
    network_mode: host
    depends_on:
      - redis
    # LIVEKIT_NODE_IP is written to docker/livekit/.env by scripts/livekit-up.sh.
    command: --config /etc/livekit.yaml --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  egress:
    image: livekit/egress:latest
    network_mode: host
    depends_on:
      - redis
      - livekit
      - minio
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-devsecret}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        insecure: true
        enable_chrome_sandbox: false

volumes:
  minio-data:
